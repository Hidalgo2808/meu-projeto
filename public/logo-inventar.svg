<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Inventar">
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="inv-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- fundo transparente para funcionar em light/dark -->
  <g>
    <!-- marca: cubo / seta expand -->
    <g transform="translate(28,28)">
      <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#inv-bg)"/>
      <rect x="0" y="0" width="104" height="104" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>
      <!-- setas expand -->
      <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M28 38 L20 30 L20 20 L30 20"/>
        <path d="M76 38 L84 30 L84 20 L74 20"/>
        <path d="M28 66 L20 74 L20 84 L30 84"/>
        <path d="M76 66 L84 74 L84 84 L74 84"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="52" cy="52" r="11" opacity="0.95"/>
        <circle cx="52" cy="52" r="4.5" fill="#2563EB"/>
      </g>
    </g>
    <!-- texto INVENTAR -->
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="152" y="86" font-weight="800" font-size="56" letter-spacing="4" fill="#0F172A">INVENTAR</text>
      <text x="154" y="114" font-weight="600" font-size="18" letter-spacing="6.5" fill="#64748B">EXPAND · WEB</text>
    </g>
  </g>
  <!-- versão dark: duplica texto claro via CSS (o componente usa filter se .dark) -->
</svg>
